# Shared benchmark config (single source for seeds/paths/defaults), mirroring
# benchmark/sshash/config.yaml and benchmark/kmc/config.yaml (same seed list,
# for cross-tool consistency of any seed-dependent order).
seeds:
  - 0x2545F4914F6CDD1D
  - 0x9E3779B97F4A7C15
  - 0xDEADBEEFCAFEBABE
  - 0x1234567890ABCDEF
  - 0xA5A5A5A5A5A5A5A5

defaults:
  # k and mod-minimizer t are not fixed here: k is the dataset preset's own
  # (lib/constants.sh preset_default_k: map-pb k=19, map-ont k=15) and
  # t = 4 + (k-4) % w (map-pb t=9, map-ont t=5); K=... / MOD_T=... override.
  w: 10
  dataset: smoke
  genome_len: 300000
  repeat_len: 20000
  n_reads: 400

paths:
  data: data
  gm_dir: ../../orders/GreedyMini
