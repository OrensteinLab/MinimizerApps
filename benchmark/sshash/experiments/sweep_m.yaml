# Secondary, explicitly OPTIONAL sweep: how much does minimizer length m
# alone move space/time at a FIXED scheme (native)? Not the primary scheme
# comparison (see sweep_schemes.yaml / README "Choice of m") -- m is held
# fixed at 21 for every scheme there specifically so the scheme sweep isolates
# the scheme's effect; this sweep isolates m's effect instead, one scheme at a
# time, and is not meant to be read side-by-side with the scheme sweep.
name: sweep_m
description: Secondary/optional -- native scheme only, m in 7/9/11/13, k=31, 3 seeds, cod only.

defaults:
  datasets: cod
  k: 31
  schemes: native
  n_seeds: 3
  threads: 16
  force: false

configs:
  - m: 7
  - m: 9
  - m: 11
  - m: 13
