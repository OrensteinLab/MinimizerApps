# Primary comparison: all minimizer schemes at the fixed k=31/m=21 this benchmark
# uses throughout (see README "Choice of k"), 5 seeds each.
name: sweep_schemes
description: Primary scheme comparison (native/xor/xor-pcg-hash/greedymini/mod-minimizer-xor/mod-minimizer-greedymini; GreedyMini tables and projections from config.yaml), k=31 m=21, 5 seeds, cod+kestrel+human+ncbi-virus+se+hprc.

defaults:
  datasets: cod,kestrel,human,ncbi-virus,se,hprc
  k: 31
  m: 21
  schemes: all
  n_seeds: 5
  threads: 16
  force: false

configs:
  - run_tag: main
