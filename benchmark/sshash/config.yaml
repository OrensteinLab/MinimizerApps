# Shared benchmark configuration (loaded by python -m scripts config and sshash_bench.sh).
#
# Seeds are the exact same 10 hex literals used by benchmark/kmc/config.yaml,
# reused here for cross-tool consistency across this monorepo's benchmarks
# (not because sshash's orders have anything numerically in common with
# kmc's -- they don't -- just so "seed index 3" means the same literal value
# in every benchmark's results tree).

seeds:
  - 0xDEADBEEF
  - 0xC0FFEE01
  - 0x31415926
  - 0x27182818
  - 0x16180339
  - 0x0BADF00D
  - 0x600D600D
  - 0xFEEDFACE
  - 0x12345678
  - 0x87654321

paths:
  gm_dir: ../../orders/GreedyMini
  experiments: experiments
  data: data

defaults:
  datasets: cod,kestrel,human,ncbi-virus,se,hprc
  # k, m, the order list and the number of seeds are NOT configured here: their single
  # source is lib/constants.sh (K, M, N_SEEDS) and lib/orders.sh (ALL_ORDERS).

# Plain-greedymini tables, each exposed as its own order "greedymini-<label>"
# (centre extension of the gm_k table to the m-mer, see orders/README.md; needs
# m - gm_k even, so at m=21 only k13 and k15). Every greedymini order also has a
# flipped-polarity twin with an "-at1" suffix (sshash --gm-projection at1-cg0:
# DNA->binary projection AT->1, CG->0 instead of the default AT->0, CG->1), e.g.
# greedymini-k13-at1. Register a new table by adding a line here (ORDERS picks
# it up from this map -- no code change).
greedymini_labels:
  k13: w11_k13_canonical.gm
  k15: w11_k15_canonical.gm
