# Shared benchmark configuration (loaded by python -m scripts config and sshash_bench.sh).
#
# Seeds are the exact same 10 hex literals used by benchmark/kmc/config.yaml,
# reused here for cross-tool consistency across this monorepo's benchmarks
# (not because sshash's orders have anything numerically in common with
# kmc's -- they don't -- just so "seed index 3" means the same literal value
# in every benchmark's results tree).

seeds:
  - 0xDEADBEEF
  - 0xC0FFEE01
  - 0x31415926
  - 0x27182818
  - 0x16180339
  - 0x0BADF00D
  - 0x600D600D
  - 0xFEEDFACE
  - 0x12345678
  - 0x87654321

paths:
  gm_dir: ../../orders/GreedyMini
  experiments: experiments
  data: data

defaults:
  datasets: cod,kestrel,human,ncbi-virus,se,hprc
  # k, m, the scheme list and the number of seeds are NOT configured here: their single
  # source is lib/constants.sh (K, M, N_SEEDS) and lib/schemes.sh (ALL_SCHEMES).

# GreedyMini variants. The scheme names are canonical (greedymini,
# mod-minimizer-greedymini); every (table, projection) pair listed here is one variant of
# the scheme, recorded in its own result columns gm_k / gm_table / projection (and mod_t).
# Register a new table or projection by adding a line -- no code change. Override at run
# time with sshash_bench.sh --gm-tables / --gm-projections.
#
# greedymini: sshash --scheme greedymini, the table's gm_k-mer extended to the m-mer around its
# centre (see orders/README.md; needs m - gm_k even, so at m=21 only gm_k 13 and 15).
# projection: the DNA->binary polarity (sshash --gm-projection): at0-cg1 = A,T->0 and
# C,G->1 (default), at1-cg0 = flipped. Both are run.
greedymini:
  tables:
    - w11_k13_canonical.gm
    - w11_k15_canonical.gm
  projections:
    - at0-cg1
    - at1-cg0

# mod-minimizer-greedymini: the strand-symmetric mod-minimizer with a GreedyMini table of
# t-mers (sshash --scheme mod-minimizer-greedymini --mod-t t, t = the table's gm_k; a table for
# mod-sampling is built for the window of T = k - t + 1 t-mers: w22_k10 is t = 10 =
# 4 + (m - 4) mod w at k=31, m=21). "mod-minimizer-xor" ranks the t-mers by xor, with
# t = 4 + (m - 4) mod w. Only t = m mod w keeps the scheme forward and at mod-sampling's
# density (a t = 11 table gave ~2.2 on random DNA and se, worse than native).
mod_minimizer_greedymini:
  tables:
    - w22_k10_canonical.gm
  projections:
    - at0-cg1
    - at1-cg0
