# Paper-style k=28 config sweep: bins × threads, plus stress (-m8 -sm).
name: sweep_config
description: Five paper datasets, k=28, default + xor + xor-pcg-hash + greedymini (5 seeds); bins 512/1024/1536 x threads 12/24, plus stress n1536 t12 (-m8 -sm).

defaults:
  datasets: f_vesca,g_gallus,m_balbisiana,h_sapiens_2,h_sapiens_3
  k: 28
  input: gzip
  scheme: all
  n_seeds: 5
  force: true

configs:
  - threads: 12
    bins: 512
  - threads: 24
    bins: 512
  - threads: 12
    bins: 1024
  - threads: 24
    bins: 1024
  - threads: 12
    bins: 1536
  - threads: 24
    bins: 1536
  - threads: 12
    bins: 1536
    mem: 8
    strict_mem: true
